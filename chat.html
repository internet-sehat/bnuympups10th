<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♡</title>
<style>
:root{--bg:#fff;--bar:rgba(247,247,249,.94);--text:#000;--muted:#8e8e93;--in:#e9e9eb;--out:#0b84fe;--border:#d1d1d6;--field:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bar:rgba(28,28,30,.94);--text:#fff;--in:#26252a;--border:#38383a;--field:#000}}
:root[data-theme="dark"]{--bg:#000;--bar:rgba(28,28,30,.94);--text:#fff;--in:#26252a;--border:#38383a;--field:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);display:flex;justify-content:center;position:fixed;inset:0;width:100%}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:500px) and (min-height:600px){body{align-items:center;background:#111}.app{flex:none;height:868px;width:409px;max-width:none;transform:scale(var(--s,1));padding-top:0;border-radius:46px;border:8px solid #000;box-shadow:0 0 0 2px #333}}

/* status bar + header */
.sb{flex:none;background:var(--bar);color:var(--text);display:flex;justify-content:space-between;align-items:center;height:calc(48px + env(safe-area-inset-top,0px));padding:calc(14px + env(safe-area-inset-top,0px)) 28px 0;font-size:15px;font-weight:600}
.sb .r{display:flex;gap:6px;align-items:center}
header{flex:none;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);height:84px;position:relative;display:flex;justify-content:space-between;padding:0 14px}
.bk,.vid{margin-top:20px;display:flex;align-items:center;color:var(--out);height:24px}
.bk .cnt{font-size:17px;margin-left:6px;line-height:1}
.who{position:absolute;left:0;right:0;top:4px;text-align:center;pointer-events:none}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(#a5aab5,#7b808c);color:#fff;font-size:23px;font-weight:600;display:grid;place-items:center;margin:0 auto;overflow:hidden;background-size:cover;background-position:center}
.nm{font-size:12px;margin-top:4px;line-height:1.1}
.nm span{color:var(--muted)}

/* messages */
#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 12px;display:flex;flex-direction:column}
.time{align-self:center;color:var(--muted);font-size:11px;margin:8px 0 4px;text-align:center}
.time b{font-weight:600}
.b{position:relative;max-width:74%;padding:7px 13px 8px;border-radius:18px;font-size:17px;line-height:22px;letter-spacing:-.2px;animation:pop .2s ease-out;word-wrap:break-word;white-space:pre-wrap}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.b.in{align-self:flex-start;background:var(--in);color:var(--text)}
.b.out{align-self:flex-end;background:var(--out);color:#fff}
.b a{text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.b.has-link{max-width:90%}
.b.in a{color:var(--out)}
.b.out a{color:#fff}
/* ekor bubble ala iMessage */
.b.tail::before,.b.tail::after,.typing::before,.typing::after{content:"";position:absolute;bottom:0;height:20px}
.b.in.tail::before,.typing::before{left:-8px;width:20px;background:var(--in);border-bottom-right-radius:15px;z-index:0}
.b.in.tail::after,.typing::after{left:-10px;width:10px;background:var(--bg);border-bottom-right-radius:10px;z-index:1}
.b.out.tail::before{right:-8px;width:20px;background:var(--out);border-bottom-left-radius:15px;z-index:0}
.b.out.tail::after{right:-10px;width:10px;background:var(--bg);border-bottom-left-radius:10px;z-index:1}
.status{align-self:flex-end;font-size:11px;font-weight:500;color:var(--muted);margin:3px 3px 0}
.typing{position:relative;align-self:flex-start;background:var(--in);border-radius:18px;padding:13px 15px;display:flex;gap:4px;animation:pop .2s ease-out}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.35}30%{opacity:1}}

/* input bar */
footer{flex:none;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:8px 10px 0;display:flex;gap:8px;align-items:center}
.plus{width:34px;height:34px;border-radius:50%;background:var(--in);color:var(--muted);display:grid;place-items:center;flex:none}
.field{position:relative;flex:1;display:flex;align-items:center;border:.5px solid var(--border);background:var(--field);border-radius:19px;padding:3px 3px 3px 13px;min-height:36px}
#inp{flex:1;border:0;outline:0;background:none;font:inherit;font-size:17px;letter-spacing:-.2px;color:var(--text);min-width:0;padding-right:4px}
#inp::placeholder{color:var(--muted)}
#send{width:30px;height:30px;border-radius:50%;border:0;background:var(--out);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
#send:disabled{opacity:0;pointer-events:none}
.mic{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);opacity:0;pointer-events:none}
#send:disabled ~ .mic{opacity:1}
.hb{flex:none;background:var(--bar);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.hb i{display:block;width:136px;height:5px;border-radius:3px;background:var(--text);opacity:.9;margin:0 auto}
.island{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
@media (min-width:500px) and (min-height:600px){.island{display:block}}
</style>
</head>
<body>
<div class="app">
  <div class="sb">
    <span id="stime"></span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 7a6.4 6.4 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="currentColor"/><rect x="24" y="4.2" width="2" height="4.6" rx="1" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>
  <header>
    <div class="bk">
      <svg width="13" height="22" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L2.5 11L11 20"/></svg>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="who"><div class="av" id="av"></div><div class="nm" id="nm"></div></div>
    <div class="vid">
      <svg width="31" height="21" viewBox="0 0 31 21" fill="currentColor"><rect x="0" y="1" width="20" height="19" rx="5.5"/><path d="M23 8.2l6.4-4.2c.9-.6 1.6-.2 1.6.8v11.4c0 1-.7 1.4-1.6.8L23 12.800Z"/></svg>
    </div>
  </header>
  <div id="msgs"></div>
  <footer>
    <div class="plus"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 1.5v13M1.5 8h13"/></svg></div>
    <div class="field">
      <input id="inp" readonly placeholder="iMessage">
      <button id="send" aria-label="Kirim">
        <svg width="14" height="15" viewBox="0 0 14 15" fill="none"><path d="M7 13.500V2M7 2L2.500 6.500M7 2l4.500 4.500" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <svg class="mic" width="14" height="21" viewBox="0 0 14 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.500" y="1" width="7" height="12" rx="3.500" fill="currentColor" stroke="none"/><path d="M1 10a6 6 0 0 0 12 0M7 16v4"/></svg>
    </div>
  </footer>
  <div class="hb"><i></i></div>
  <div class="island"></div>
</div>

<script>
/* ==========================================================
   PENGATURAN — ubah di bagian ini saja
   ========================================================== */

// Nama yang tampil di header
const SENDER = "mpup's bnuy";

// Foto profil. Isi salah satu:
//  - nama file di folder yang sama dengan index.html, contoh: "foto.jpg"
//  - link gambar, contoh: "https://situsmu.com/foto.jpg"
//  - kosongkan ("") kalau mau pakai huruf pertama nama
const PHOTO = "mcn2.jpg";

// Bagian foto yang ditampilkan di lingkaran (foto dipotong jadi bulat).
// "center 20%" cocok untuk foto potret agar wajah tidak terpotong.
// Ubah angkanya: makin kecil = bagian atas foto, makin besar = bagian bawah.
// Foto persegi tidak perlu diatur.
const PHOTO_POS = "center 20%";

// Teks tanggal di atas obrolan. "Today" otomatis ditambah jam, jadi "Today 12.28".
// Atau tulis lengkap, contoh: "Today 19.02"
const TIME_LABEL = "Today";

// Jam di status bar. Kosongkan ("") untuk pakai jam asli perangkat,
// atau isi tetap, contoh: "19.02"
const FAKE_TIME = "";

// Angka biru di samping tombol kembali (jumlah pesan belum dibaca).
// Isi 0 atau "" untuk menyembunyikan.
const UNREAD = 1;

// Tulisan status di bawah pesan kamu
const STATUS_DELIVERED = "Delivered";
const STATUS_READ = "Read";   // otomatis ditambah jam, jadi "Read 12.28"

// Link di dalam pesan otomatis bisa diketuk.
// "_blank" = buka di tab baru, "_self" = buka langsung di tab yang sama.
const LINK_TARGET = "_blank";

// Isi obrolan, satu pesan per baris:
//   "<"  = pesan dari pengirim
//   ">"  = balasan kamu (otomatis terisi di kolom, tinggal klik send)
const SCRIPT = `
< baby!!!
< guess what day it is today, baby?
> it's our 2nd mensive!
< yepyepyep! \\0/
< here we are, meeting each other again on the 10th!
< baby, thank you for being the love i get to come home to. i'm so grateful that i get to call you my girlfriend. thank you for being the person i can always turn to, the comfort i find in difficult days, and the light that makes even my darkest nights feel brighter. i'm incredibly lucky to be loved by you. i love you forever & always, the mpup to my bnuy!
< press 1 to claim your gift :3
> 11111
< here's a little something to commemorate our second mensiversary. a personalized boxd where you can log all the movies we've watched together! 
< https://archivedbymikael.netlify.app/
`;

/* ==========================================================
   KODE — biasanya tidak perlu diubah
   ========================================================== */
const $=id=>document.getElementById(id);
const msgs=$("msgs"), inp=$("inp"), send=$("send");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const opening=[], steps=[];
let step=0, busy=false;

SCRIPT.split("\n").forEach(l=>{
  l=l.trim();if(!l)return;
  const c=l[0],t=l.slice(1).trim();if(!t)return;
  if(c==="<"){(steps.length?steps[steps.length-1].then:opening).push(t)}
  else if(c===">"){steps.push({reply:t,then:[]})}
});

function clock(){const d=new Date();return FAKE_TIME||(String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0"))}
function tick(){$("stime").textContent=clock()}
tick();setInterval(tick,10000);

// header
$("nm").textContent=SENDER+" ";
const chev=document.createElement("span");chev.textContent="›";$("nm").appendChild(chev);
if(PHOTO){$("av").style.backgroundImage=`url("${PHOTO}")`;$("av").style.backgroundPosition=PHOTO_POS}else{$("av").textContent=SENDER[0].toUpperCase()}
if(UNREAD)$("cnt").textContent=UNREAD;

// label tanggal: bagian tanggal tebal, jam tipis (seperti iMessage)
(function(){
  const m=TIME_LABEL.match(/^(.*?)\s+(\d{1,2}[.:]\d{2}.*)$/);
  const d=document.createElement("div");d.className="time";
  const b=document.createElement("b");b.textContent=m?m[1]:TIME_LABEL;
  d.appendChild(b);d.appendChild(document.createTextNode(" "+(m?m[2]:clock())));
  msgs.appendChild(d);
})();

function fill(el,t){
  const re=/(https?:\/\/[^\s]+|www\.[^\s]+)/g;let i=0,m;
  while((m=re.exec(t))){
    let url=m[0],trail="";const tm=url.match(/[.,!?)\]]+$/);
    if(tm){trail=tm[0];url=url.slice(0,-trail.length)}
    if(m.index>i)el.appendChild(document.createTextNode(t.slice(i,m.index)));
    el.classList.add("has-link");const a=document.createElement("a");a.textContent=url;a.href=/^https?:/.test(url)?url:"https://"+url;
    a.target=LINK_TARGET;a.rel="noopener noreferrer";el.appendChild(a);
    if(trail)el.appendChild(document.createTextNode(trail));
    i=m.index+m[0].length;
  }
  if(i<t.length)el.appendChild(document.createTextNode(t.slice(i)));
}
function scroll(){msgs.scrollTop=msgs.scrollHeight}
function lastBubble(){const a=msgs.querySelectorAll(".b");return a[a.length-1]}
function bubble(t,dir){
  const last=lastBubble(), same=last&&last.classList.contains(dir);
  if(same)last.classList.remove("tail");
  const d=document.createElement("div");
  d.className="b "+dir+" tail";d.style.marginTop=same?"2px":"10px";
  fill(d,t);msgs.appendChild(d);scroll();
}
async function incoming(list){
  for(const t of list){
    const last=lastBubble();
    const ty=document.createElement("div");ty.className="typing";ty.innerHTML="<i></i><i></i><i></i>";
    ty.style.marginTop=(last&&last.classList.contains("in"))?"2px":"10px";
    msgs.appendChild(ty);scroll();
    await wait(1100);ty.remove();bubble(t,"in");await wait(300);
  }
}
function loadNext(){
  if(step<steps.length){inp.value=steps[step].reply;send.disabled=false}
  else{inp.value="";send.disabled=true}
}
send.addEventListener("click",async()=>{
  if(busy||step>=steps.length)return;
  busy=true;send.disabled=true;
  const s=steps[step];inp.value="";
  bubble(s.reply,"out");
  const st=document.createElement("div");st.className="status";st.textContent=STATUS_DELIVERED;msgs.appendChild(st);scroll();
  await wait(700);st.textContent=STATUS_READ+" "+clock();
  await wait(500);
  await incoming(s.then);
  st.remove();step++;busy=false;loadNext();
});
(async()=>{send.disabled=true;await wait(500);await incoming(opening);loadNext()})();
</script>
<script>
/* Di desktop: ukuran layar tetap 393x852 (=1179x2556 @3x), bingkai diperkecil utuh jika jendela pendek */
(function(){var el=document.querySelector('.app'),mq=matchMedia('(min-width:500px) and (min-height:600px)');function fit(){el.style.setProperty('--s',mq.matches?Math.min(1,innerHeight*.96/868):1)}fit();addEventListener('resize',fit)})();
</script>
</body>
</html>
